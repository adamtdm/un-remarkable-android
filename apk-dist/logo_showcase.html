<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UR Logo Variations</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    .grid {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #1e1e22;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .caption {
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Un-remarkable Logo Explorations (White on Black)</h1>
  <div class="grid">
    <div class="card">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <rect width="140" height="140" rx="32" fill="#000"/>
        <!-- Continuous Monogram: U shares spine with R -->
        <path d="M 32 38 L 32 78 C 32 94 44 102 56 102 C 68 102 80 94 80 78 L 80 38 L 92 38 C 104 38 112 45 112 56 C 112 67 104 74 92 74 L 80 74" 
              fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 91 74 L 112 102" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
      </svg>
      <div class="caption">1. Continuous Monoline Monogram</div>
    </div>

    <div class="card">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <rect width="140" height="140" rx="32" fill="#000"/>
        <!-- Side-by-Side Geometric Dual-Glyph -->
        <g fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 28 42 L 28 78 C 28 92 38 100 50 100 C 62 100 72 92 72 78 L 72 42"/>
          <path d="M 88 42 L 88 100"/>
          <path d="M 88 42 L 102 42 C 114 42 121 49 121 58 C 121 67 114 74 102 74 L 88 74"/>
          <path d="M 101 74 L 121 100"/>
        </g>
      </svg>
      <div class="caption">2. Geometric Twin Glyphs (U + R)</div>
    </div>

    <div class="card">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <rect width="140" height="140" rx="32" fill="#000"/>
        <!-- Bold Ribbon Fold Style (like reMarkable icon) -->
        <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <!-- U -->
          <path d="M 26 44 L 26 76 C 26 92 36 100 48 100 C 60 100 70 92 70 76 L 70 44"/>
          <!-- R with angled dynamic leg -->
          <path d="M 86 44 L 86 100"/>
          <path d="M 86 44 Q 118 44 118 60 Q 118 75 86 75"/>
          <path d="M 98 75 L 120 100"/>
        </g>
      </svg>
      <div class="caption">3. Clean Ribbon (reMarkable-matched)</div>
    </div>

    <div class="card">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <rect width="140" height="140" rx="32" fill="#000"/>
        <!-- Stylized lowercase u + capital R -->
        <g fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
          <!-- u with stem -->
          <path d="M 28 58 L 28 84 C 28 94 36 100 48 100 C 60 100 68 94 68 84 L 68 58 M 68 82 L 68 100"/>
          <!-- R -->
          <path d="M 86 40 L 86 100"/>
          <path d="M 86 40 L 102 40 C 114 40 122 47 122 57 C 122 67 114 73 102 73 L 86 73"/>
          <path d="M 100 73 L 122 100"/>
        </g>
      </svg>
      <div class="caption">4. Lowercase u + Uppercase R</div>
    </div>
  </div>
</body>
</html>
